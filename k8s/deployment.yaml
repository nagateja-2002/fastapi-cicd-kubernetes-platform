apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-platform
  namespace: fastapi-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-platform
  template:
    metadata:
      labels:
        app: fastapi-platform
    spec:
      containers:
        - name: fastapi
          image: fastapi-cicd-platform:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi